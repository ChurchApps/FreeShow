name: Bug report
description: Help us improve the stability of FreeShow
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please:
        - Search existing **open and closed** issues.
        - Test on the latest stable version.
        - Test on the latest beta version if possible.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing open and closed issues.
          required: true
        - label: I reproduced this on the latest stable version.
          required: true
        - label: I reproduced this on the latest beta version, or I am unable to test the beta.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: What happened?
    validations:
      required: true

  - type: dropdown
    id: reproducible
    attributes:
      label: How often does this happen?
      options:
        - Every time
        - Sometimes
        - Only once

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots, logs, or files
      description: Drag and drop screenshots, log files, or other helpful files here if they help explain the issue.

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other

  - type: input
    id: version
    attributes:
      label: FreeShow version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
