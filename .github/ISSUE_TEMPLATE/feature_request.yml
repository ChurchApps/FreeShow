name: Feature request
description: Suggest a new feature or improvement for FreeShow
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please:
        - Search existing **open and closed** [issues](https://github.com/ChurchApps/FreeShow/issues?q=is%3Aissue), if you find a related request, please comment there even though it may be closed.
        - You can optionally search through the changelog to see if your request has already been added recently: [See all releases](https://github.com/ChurchApps/FreeShow/releases)
        - Also there's a big likelihood that what you have in mind is already an existing feature in some way and possible to do in the program.

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: A clear and concise description of what you would like to add/change.
      placeholder: What would you like to see added or improved?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Use case
      description: Describe why you need this feature.
      placeholder: I need this feature because...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context or information or screenshots that might be helpful here
