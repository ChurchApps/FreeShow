name: PolinRider scan

# Fails the build on editor autorun tasks, fake font files, and known loader markers.
# The scanner is ChurchApps/.github/.github/workflows/polinrider-scan.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polinrider-scan:
    name: polinrider-scan
    permissions:
      contents: read
    uses: ChurchApps/.github/.github/workflows/polinrider-scan.yml@main
