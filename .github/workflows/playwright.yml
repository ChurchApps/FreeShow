name: Playwright Tests
on:
    # Electron now launches on CI with --no-sandbox (see config/testing/start.test.ts).
    # Kept as workflow_dispatch too so a run can be triggered manually to verify.
    push:
        branches: [dev, fix-playwright-2]
    pull_request:
        branches: [dev]
    workflow_dispatch:

jobs:
    test:
        # The whole suite runs in well under a minute; keep a tight ceiling so a
        # regression that hangs on exit fails the job fast instead of burning an hour.
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install libraries
              run: sudo apt-get install libfontconfig1-dev
            - name: Install dependencies
              run: npm install
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Build
              run: npm run build
            - name: Run Playwright tests
              run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npm run test:playwright
            #   if: matrix.os == 'ubuntu-latest'
            # - run: npm run test
            #   if: matrix.os != 'ubuntu-latest'
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-output
                  path: test-output/
                  retention-days: 30
