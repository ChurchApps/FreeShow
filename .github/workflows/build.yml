name: Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          [
            # windows-2022 (not -latest): new windows-latest runners ship VS 18,
            # which node-gyp cannot identify, breaking the grandiose (NDI) native
            # dependency's `node-gyp rebuild`. The repo's release workflow already
            # builds Windows on windows-2022 for the same reason.
            windows-2022,
            macos-latest,
            ubuntu-latest
          ]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
