name: freeshow
version: PLACEHOLDER
title: FreeShow
summary: Show song lyrics and more for free!
description: A dynamic, user-friendly, and open-source presenter built for all of your presentations.
contact:
    - dev@freeshow.app
license: GPL-3.0-or-later
donation:
    - https://churchapps.org/partner
issues:
    - https://github.com/churchapps/freeshow/issues
source-code:
    - https://github.com/churchapps/freeshow
website:
    - https://freeshow.app
platforms:
    amd64:
        build-on: amd64
        build-for: amd64
    arm64:
        build-on: arm64
        build-for: arm64
base: core26
grade: stable
confinement: strict
lint:
    ignore:
        - library:
            # Sharp is loaded dynamically; retain its native binding and libvips.
            - resources/app.asar.unpacked/node_modules/@img/sharp-linux-*/lib/*.node
            - resources/app.asar.unpacked/node_modules/@img/sharp-libvips-linux-*/lib/libvips-cpp.so.*
            # Retain the NDI file SDK even though its advanced library is not bundled.
            - resources/app.asar.unpacked/node_modules/grandiose/build/Release/libndifile.so*
            # Preserve this staged library for dynamically loaded dependencies.
            - usr/lib/*/libpsl.so.*
layout:
    /usr/share/alsa:
        bind: $SNAP/usr/share/alsa
    /usr/share/libdrm:
        bind: $SNAP/usr/share/libdrm
parts:
    freeshow:
        source: dist/linux-unpacked/
        plugin: dump
        stage-packages:
            - libasound2t64
            - libnode127
            - libglu1-mesa
            - libltc11
            - libproxy1v5
            - libdrm-common
            - libusb-1.0-0
            - libudev1
        prime:
            - "*"
            # libltc-wrapper uses the copy in build/Release at runtime.
            - "-resources/app.asar.unpacked/node_modules/libltc-wrapper/libltc/arm-bin"
            - "-resources/app.asar.unpacked/node_modules/libltc-wrapper/libltc/arm64-bin"
            - "-resources/app.asar.unpacked/node_modules/libltc-wrapper/libltc/bin"
            - "-resources/app.asar.unpacked/node_modules/jazz-midi/bin/linuxa7"
            - "-resources/app.asar.unpacked/node_modules/jazz-midi/bin/*/linuxa7"
            - "-resources/app.asar.unpacked/node_modules/@img/sharp-linuxmusl-*"
            - "-resources/app.asar.unpacked/node_modules/@img/sharp-libvips-linuxmusl-*"
            - "-resources/app.asar.unpacked/node_modules/node-hid/prebuilds/*-linux-*-musl"
            - to amd64:
                - "-resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/linux-arm64.node"
                - "-resources/app.asar.unpacked/node_modules/node-hid/prebuilds/*-linux-arm*"
                - "-resources/app.asar.unpacked/node_modules/openmediatransport/lib/linux-arm64"
            - to arm64:
                - "-resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/linux-x64.node"
                - "-resources/app.asar.unpacked/node_modules/node-hid/prebuilds/*-linux-x64*"
                - "-resources/app.asar.unpacked/node_modules/node-hid/prebuilds/*-linux-arm"
                - "-resources/app.asar.unpacked/node_modules/openmediatransport/lib/linux-amd64"
                - "-resources/app.asar.unpacked/node_modules/jazz-midi/bin/linux64"
                - "-resources/app.asar.unpacked/node_modules/jazz-midi/bin/*/linux64"
apps:
    freeshow:
        command: command.sh
        extensions: [gnome]
        plugs:
            - alsa
            - audio-playback
            - avahi-control
            - browser-support
            - camera
            - home
            - network
            - network-bind
            - network-observe
            - network-setup-observe
            - pulseaudio
            - pipewire
            - removable-media
            - screen-inhibit-control
        environment:
            PATH: $SNAP/usr/sbin:$SNAP/usr/bin:$SNAP/sbin:$SNAP/bin:$PATH
            SNAP_DESKTOP_RUNTIME: $SNAP/gnome-platform
            LD_LIBRARY_PATH: $SNAP_LIBRARY_PATH:$SNAP/lib:$SNAP/usr/lib:$LD_LIBRARY_PATH
