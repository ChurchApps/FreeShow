appId: app.freeshow
productName: FreeShow
artifactName: FreeShow-${version}-${arch}.${ext}
electronLanguages:
    - en-US

files:
    - build/electron/**
    - build/types/**
    - public/**
    - "!node_modules/@napi-rs"
    - "!**/node_modules/*/{CHANGELOG*,README*,test*,example*,docs}"
    - "!**/node_modules/*/{*.d.ts,*.ts,*.map}"
    - "!**/node_modules/{@types,typescript}/**"
    - "!**/node_modules/**/*.{pdb,iobj,ipdb,obj,lib,exp,a,o,c,cc,cpp,h,hpp,gyp*,vcxproj*,filters,sln}"
    - "!**/node_modules/**/prebuild/node-v*"
    - "!**/node_modules/grandiose/ndi/**"
    - "!**/node_modules/osr-capture/**/on12_harness.exe"
    - "!**/node_modules/koffi/build/koffi/{freebsd_*,openbsd_*,linux_ia32,linux_armhf,linux_loong64,linux_riscv64d,musl_*}/**"
    - "!**/node_modules/@julusian/jpeg-turbo/prebuilds/jpeg-turbo-{linux-arm,linux-x64-musl,win32-ia32}/**"

extraResources:
    - from: node_modules/slideshow/
      to: slideshow
      filter:
          - connector-*

# windows

win:
    target: NSIS
    icon: build/public/icon.png
    files:
        - "!**/node_modules/openmediatransport/lib/{macos,linux-*,win-arm64}/**"
        - "!**/node_modules/better-sqlite3/prebuilds/{darwin-*,linux*,win32-arm64}.node"
        - "!**/node_modules/koffi/build/koffi/{darwin_*,linux_*,win32_arm64}/**"
        - "!**/node_modules/@julusian/jpeg-turbo/prebuilds/jpeg-turbo-{darwin-*,linux-*,win32-arm64}/**"
    asarUnpack:
        - "**/node_modules/macadam/**/*.node"
        - "**/node_modules/libspotifyctl/**/*"
        - "**/node_modules/openmediatransport/**"
        - "**/assets/bin/aero-peek-helper.exe"
        - "**/assets/bin/hid-input-helper.exe"
    azureSignOptions:
        publisherName: Live Church Solutions
        endpoint: https://wus2.codesigning.azure.net/
        certificateProfileName: FreeShow
        codeSigningAccountName: FreeShow

# linux

linux:
    files:
        - "!**/node_modules/openmediatransport/lib/{macos,win-*}/**"
        - "!**/node_modules/better-sqlite3/prebuilds/{darwin-*,linuxmusl-*,win32-*}.node"
        - "!**/node_modules/koffi/build/koffi/{darwin_*,win32_*}/**"
        - "!**/node_modules/@julusian/jpeg-turbo/prebuilds/jpeg-turbo-{darwin-*,win32-*}/**"
    asarUnpack:
        - "**/node_modules/@julusian/jpeg-turbo/prebuilds/**"
        - "**/node_modules/grandiose/**"
        - "**/node_modules/openmediatransport/**"
        - "**/node_modules/macadam/**/*.node"
        - "**/node_modules/libltc-wrapper/**/*"
    category: AudioVideo
    target:
        - AppImage
        - deb
        - rpm
    icon: build/public

deb:
    depends:
        - libfontconfig1
        - uuid-runtime
        - libltc11
        - libavahi-client3
        - avahi-daemon

# macos

mac:
    icon: build/public/icon.png
    files:
        - "!**/node_modules/openmediatransport/lib/{linux-*,win-*}/**"
        - "!**/node_modules/better-sqlite3/prebuilds/{linux*,win32-*}.node"
        - "!**/node_modules/koffi/build/koffi/{linux_*,win32_*}/**"
        - "!**/node_modules/@julusian/jpeg-turbo/prebuilds/jpeg-turbo-{linux-*,win32-*}/**"
    asarUnpack:
        - "**/node_modules/macadam/**/*.node"
        - "**/node_modules/openmediatransport/**"
    target:
        - target: dmg
          arch:
              - x64
              - arm64
        - target: zip
          arch:
              - x64
              - arm64
    category: public.app-category.utilities
    hardenedRuntime: true
    gatekeeperAssess: false
    notarize: false
    entitlements: scripts/macos/entitlements.mac.plist
    entitlementsInherit: scripts/macos/entitlements.mac.plist
    extendInfo:
        NSMicrophoneUsageDescription: Please give access to your microphone if you want to use it for input.
        NSCameraUsageDescription: Please give access to your camera if you want to use it for input.
        NSAudioCaptureUsageDescription: Please give access to audio capture for desktop capture.
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true

afterExtract: scripts/opus.js
afterSign: scripts/macos/notarize.js

dmg:
    background: build/public/dmg.png
    sign: false
    contents:
        - x: 140
          y: 150
        - x: 400
          y: 150
          type: link
          path: /Applications
